<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        .container{
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .card {
            width: 30%;
            height: 50%;
            padding: 30px;
            border: 1px solid grey;
            border-radius: 10px;
        }
        .btnSubmit{
            width: 30%;
            align-self: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h3>Login</h3>
            <h4>Need a Mailchimp account? <a href="#">Create an account</a></h4>

            <form action="" style="display: flex; flex-direction: column;">
                <label for="email">Email</label>
                <input type="email" required>
                <label for="password">Password</label>
                <input type="password">
                <div>

                    <input type="checkbox"> <label for="">Keep me logged in</label>
                </div>
                <button class="btnSubmit" type="submit">Log in</button>
                
            </form>
        </div>
    </div>
